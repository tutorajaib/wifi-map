<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PPPoE Live Monitor — Map Realtime</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    body{margin:0;font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial}
    #map{height:100vh}
    .legend{background:#fff;padding:8px;border-radius:6px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
    .marker-online{background:#16a34a;border-radius:50%;width:12px;height:12px;display:inline-block;margin-right:6px;border:2px solid white}
    .marker-offline{background:#ef4444;border-radius:50%;width:12px;height:12px;display:inline-block;margin-right:6px;border:2px solid white}
    .top-controls{position:absolute;left:8px;top:8px;z-index:1000;display:flex;gap:8px}
    .top-controls select, .top-controls button{padding:6px;border-radius:6px;border:1px solid #ddd;background:#fff;cursor:pointer}
    .notif-bar{position:absolute;right:50px;top:8px;z-index:1000;background:rgba(255,255,255,0.95);padding:8px;border-radius:6px;box-shadow:0 2px 6px rgba(0,0,0,.12);max-width:250px}
  </style>
</head>
<body>
  <div class="top-controls">
    <select id="basemapSelect" aria-label="Pilih tipe peta">
      <option value="osm">OpenStreetMap</option>
      <option value="sat">Esri Satellite</option>
      <option value="topo">OpenTopoMap</option>
    </select>
    <button id="fitAll">Fit Semua Marker</button>
  </div>
  <div class="notif-bar" id="notifBar">Ready</div>
  <div id="map"></div>

  <audio id="notifSound" src="https://www.myinstants.com/media/sounds/notification.mp3" preload="auto"></audio>

<script>
  // Konfigurasi Firebase
  const firebaseConfig = { databaseURL: "https://wifi-maps-fed29-default-rtdb.asia-southeast1.firebasedatabase.app/" };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const ref = db.ref('pppoe');

  // Tile Providers
  const baseOSM = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OSM'});
  const baseEsriSat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'© Esri'});
  const baseTopo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:17,attribution:'© OpenTopoMap'});

  // 1. Inisialisasi Layer Group (Overlay)
  const layerWithACS = L.layerGroup();
  const layerNoACS = L.layerGroup();

  const map = L.map('map',{
    layers: [baseOSM, layerWithACS, layerNoACS] // Aktifkan semua di awal
  }).setView([-7.14, 110.95], 14);

  // 2. Tambahkan Control Layer di Pojok Kanan Atas
  const baseMaps = {'OpenStreetMap':baseOSM,'Esri Satellite':baseEsriSat,'OpenTopoMap':baseTopo};
  const overlayMaps = {
    "User with ACS": layerWithACS,
    "User No ACS": layerNoACS
  };
  L.control.layers(baseMaps, overlayMaps, {collapsed:false}).addTo(map);

  // Dropdown Basemap manual (opsional, karena sudah ada di L.control.layers)
  document.getElementById('basemapSelect').addEventListener('change',e=>{
    const v = e.target.value;
    Object.values(baseMaps).forEach(l=>map.removeLayer(l));
    if(v==='osm') map.addLayer(baseOSM);
    else if(v==='sat') map.addLayer(baseEsriSat);
    else if(v==='topo') map.addLayer(baseTopo);
  });

  // Marker Icons
  const onlineIcon = L.divIcon({className:'',html:'<span class="marker-online"></span>',iconSize:[14,14]});
  const offlineIcon = L.divIcon({className:'',html:'<span class="marker-offline"></span>',iconSize:[14,14]});
  
  const markers = {};
  let lastStatus = {};
  let lastACS = {};

function buildPopup(item){
    const lat = parseFloat(item.latitude||0);
    const lon = parseFloat(item.longitude||0);
    const gmLink = `https://www.google.com/maps/search/?api=1&query=${lat},${lon}`;
    const waLink = item.whatsapp ? `https://wa.me/${item.whatsapp.replace(/[^0-9]/g,'')}` : '#';
    const statusColor = (item.online==1 || item.status==1) ? 'green' : 'red';
    const statusText = (item.online==1 || item.status==1) ? 'Online' : 'Offline';

    return `
      <div style="font-size:12px;">
        <strong style="font-size:14px;">${item.fullname || 'Tanpa Nama'}</strong><br/>
        <span class="popup-label">User:</span> ${item.user}<br/>
        <span class="popup-label">IP:</span> <a href="http://${item.address}" target="_blank">${item.address}</a><br/>
        <span class="popup-label">Profile:</span> ${item.profile || '-'}<br/>
        <span class="popup-label">Service:</span> ${item.service || '-'}<br/>
        <span class="popup-label">Radius:</span> ${item.radius || '-'}<br/>
        <span class="popup-label">NAS:</span> ${item.nas || '-'}<br/>
        <span class="popup-label">ACS:</span> ${item.ACS || '-'}<br/>
        <button onclick="updateACS('${item.user}')" style="margin:4px 0; display:block; cursor:pointer; width:100%">Update ACS: ${item.user}</button>
        <span class="popup-label">Modem:</span> ${item.modem || '-'}<br/>
        <span class="popup-label">RxPower:</span> ${item.rxpower || '-'}<br/>
        <span class="popup-label">Uptime:</span> ${item.uptime || '-'}<br/>
        <span class="popup-label">Aktif:</span> ${item.activedate || '-'}<br/>
        <span class="popup-label">Status:</span> <span style="color:${statusColor}; font-weight:bold">${statusText}</span><br/>
        <hr style="margin:8px 0; border:0; border-top:1px solid #eee"/>
        <div style="display:flex; justify-content:space-between">
          <a href="${gmLink}" target="_blank" style="text-decoration:none">📍 Google Maps</a>
          <a href="${waLink}" target="_blank" style="text-decoration:none">💬 WhatsApp</a>
        </div>
      </div>
    `;
  }

  function updateACS(deviceid){
    fetch(`http://192.168.18.1:5678/webhook/production/?devid=${deviceid}`)
      .then(() => alert('Request sent for ' + deviceid))
      .catch(e => console.error('Fetch error:', e));
  }

  function addOrUpdateMarker(key, data){
    if(!data || data.suspend==='suspend') return;
    if(!data.latitude || !data.longitude) return;

    const lat = parseFloat(data.latitude);
    const lng = parseFloat(data.longitude);
    if(Number.isNaN(lat)||Number.isNaN(lng)) return;

    const icon = (data.online==1 || data.status==1) ? onlineIcon : offlineIcon;
    
    // 3. Logika Pemilihan Layer Berdasarkan Field ACS
    const hasACS = (data.ACS && data.ACS !== "" && data.ACS !== "0");
    const targetLayer = hasACS ? layerWithACS : layerNoACS;

    if(markers[key]){
      // Update posisi dan icon
      markers[key].setLatLng([lat,lng]);
      markers[key].setIcon(icon);
      markers[key].setPopupContent(buildPopup(data));

      // Jika layer berubah (misal dari No ACS ke With ACS), pindahkan
      if(markers[key]._currentLayer !== targetLayer){
        markers[key]._currentLayer.removeLayer(markers[key]);
        targetLayer.addLayer(markers[key]);
        markers[key]._currentLayer = targetLayer;
      }
    } else {
      // Buat marker baru
      const m = L.marker([lat,lng],{icon}).bindPopup(buildPopup(data));
      m._currentLayer = targetLayer;
      targetLayer.addLayer(m);
      markers[key] = m;
    }
  }

  function removeMarker(key){
    if(markers[key]){
      markers[key]._currentLayer.removeLayer(markers[key]);
      delete markers[key];
    }
  }

  function notify(text){
    notifBar.textContent = text;
    try {
      const u = new SpeechSynthesisUtterance(text); u.lang='id-ID'; u.rate=1.1; 
      speechSynthesis.cancel(); // Hentikan bicara sebelumnya jika menumpuk
      speechSynthesis.speak(u);
    } catch(e){}
  }

  // Firebase Realtime Listeners
  ref.on('child_added', snap => {
    const key = snap.key; const data = snap.val();
    addOrUpdateMarker(key, data);
    lastStatus[key] = data.status;
    lastACS[key] = data.ACS;
  });

  ref.on('child_changed', snap => {
    const key = snap.key; const data = snap.val();
    const prevStatus = lastStatus[key];
    const prevACS = lastACS[key];

    addOrUpdateMarker(key, data);
    
    // Notif Perubahan Status Online/Offline
    if(prevStatus !== undefined && String(prevStatus) !== String(data.status)){
      const s = data.status == 1 ? 'Online' : 'Offline';
      notify(`${data.user || key} ${s}`);
    }

    // Notif Perubahan ACS (hanya jika berubah ke 1)
    if (prevACS !== undefined && String(prevACS) !== String(data.ACS)) {
      if (Number(data.ACS) === 1) {
        notify(`User ${data.user || key}: ACS aktif`);
      }
    }

    lastStatus[key] = data.status;
    lastACS[key] = data.ACS;
  });

  ref.on('child_removed', snap => {
    removeMarker(snap.key);
    notify(`User dihapus: ${snap.val()?.user || snap.key}`);
    delete lastStatus[snap.key];
    delete lastACS[snap.key];
  });

  // Fit bounds
  document.getElementById('fitAll').addEventListener('click', ()=>{
    const latlngs = [];
    Object.values(markers).forEach(m=>latlngs.push(m.getLatLng()));
    if(latlngs.length) map.fitBounds(L.latLngBounds(latlngs).pad(0.2));
  });
</script>
</body>
</html>
